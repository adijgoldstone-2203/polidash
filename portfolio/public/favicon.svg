<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#333" stroke-width="0.8"/>

  <!-- "A" glyph — left side, tight -->
  <text
    x="5"
    y="23"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="17"
    fill="url(#text-grad)"
    letter-spacing="-0.5"
  >AG</text>

  <!-- Accent underline -->
  <rect x="5" y="25.5" width="22" height="1.5" rx="0.75" fill="#5c6bff" opacity="0.9"/>
</svg>
