name: Daily Political Quotes Scraper (Gemini API)

on:
  schedule:
    # Runs at 06:00 AM UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions UI

jobs:
  scrape-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Gemini Quotes Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/scripts/fetch_daily_quotes.cjs

      - name: Commit & Push Updated Statements JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/recent_statements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily political quotes feed [Gemini AI]" && git push)
